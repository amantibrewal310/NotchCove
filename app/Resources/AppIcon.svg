      <rect x="190" y="92" width="132" height="84" rx="16" fill="#BCDBFF" stroke="#F7F8FA" stroke-width="10"/>
      <rect x="150" y="166" width="212" height="112" rx="22" fill="#5AAEFF" stroke="#F3F4F7" stroke-width="10"/>
      <rect x="104" y="266" width="304" height="152" rx="30" fill="#0A7AF0" stroke="#EEF0F3" stroke-width="10"/>
      <rect x="136" y="294" width="96" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.85"/>
      <path d="M126 0H386V64C386 97 360 118 328 118H184C152 118 126 97 126 64Z" fill="#000000"/>
    </g>
